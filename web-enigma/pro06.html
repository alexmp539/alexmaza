<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pro06</title>
</head>
<body>
    <script>
      let monto = (prompt("Ingresa el monto total de la cuenta:"));
      let personas = (prompt("¿Cuántas personas participaron en la cena?"));

      let pago = (monto / personas)

      document.write("Cada persona debe pagar: S/ " + pago.toFixed(2));




    </script>
</body>
</html>
