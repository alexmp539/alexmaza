<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pro07</title>
</head>
<body>
    <script>
        let sueldofinal;

        let sueldo = Number(prompt("Ingresa tu sueldo"));
        let descontado = 13;
        montodescontado = (sueldo * descontado)/100
        sueldofinal = sueldo * (100 - descontado)/100

        document.write("sueldo bruto:" + "S/" + sueldo + "<br>")
        document.write("plata descontada:" + "S/"+ montodescontado + "<br>")
        document.write("-----------------------------" + "<br>")
        document.write("sueldo final:" + "S/" + sueldofinal)

    </script>




</body>
</html>
