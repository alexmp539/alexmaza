<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pro05</title>
</head>
<body>
    <script>
        let total;
        let montodescuento;
       
        let precio = Number(prompt("Cuanto esta tu producto"));
        let descuento = Number(prompt("Cuanto es tu descuento"));
        total = precio * (100 - descuento)/100;
        montodescuento = (precio * descuento)/100
        
        document.write("Precio Inicial:" + precio + "<br>")
        document.write("Precio Final:" + "S/" + total + "<br>")
        document.write("--------------------------------" + "<br>")
        document.write("Monto Descontado:" + "S/" + montodescuento)
    </script>
</body>
</html>
