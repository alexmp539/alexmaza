<body>
    <script>
        let nom = "Alex"
        let promedio;

        let nota1 = Number(prompt("Ingresa tu nota 1"));
        let nota2 = Number(prompt("Ingresa tu nota 2"));
        let nota3 = Number(prompt("Ingresa tu nota 3"));
        promedio = (nota1 + nota2 + nota3)/3

        document.write("Nota 1:" + nota1 + "<br>")
        document.write("Nota 2:" + nota2 + "<br>")
        document.write("Nota 3:" + nota3 + "<br>")
        document.write("------------------" + "<br>")
        document.write("Promedio:" + promedio.toFixed(1))
    </script>
