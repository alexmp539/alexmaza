<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pro01</title>
</head>
<body>
    <script>
        let total

        let precio = Number(prompt("Cuanto costo su gaseosa"));
        let cantidad = Number(prompt("Cuantas gaseosas compro"));
        total =(precio * cantidad)

        document.write("Precio de c/u:" + "S/" + precio + "<br>")
        document.write("cantidad:" + cantidad + "<br>")
        document.write("---------------------" + "<br>")
        document.write("Total:" + "S/" + total)
    </script>



</body>
</html>
